storage:
  root: "./data"
  sessions_dir: "./data/sessions"
  catalog_db: "./data/catalog.sqlite"

summarization:
  messages_per_batch: 20
  token_threshold: 12000
  idle_minutes: 30
  max_input_tokens: 16000
  max_output_tokens: 2500
  new_messages_budget_tokens: 9000
  topic_cards_budget_tokens: 2000
  existing_summaries_budget_tokens: 4000
  existing_summaries_top_k: 8

retrieval:
  lexical_top_k: 30
  vector_top_k: 30
  final_top_k: 5
  auto_open_summaries: 2
  total_context_budget_tokens: 3000
  card_budget_tokens: 300
  summary_budget_tokens: 1500
  source_budget_tokens: 1200
  minimum_score: 0.35
  vector_min_similarity: 0.35
  lexical_min_query_coverage: 0.34
  rrf_k: 60

# Optional derived layer. It is never built automatically and never replaces
# immutable session topic files. Use `python run.py rebuild-global-topics`.
global_topics:
  minimum_versions: 12
  title_similarity_threshold: 0.50
  lexical_similarity_threshold: 0.72
  total_token_budget: 3000

api:
  bearer_token_env: "MNEMONIC_VAULT_API_TOKEN"
  max_request_bytes: 262144
  max_message_chars: 100000
  max_query_chars: 20000

memory_llm:
  # Проверено с хоста .14: активный vLLM endpoint Qwen работает на DGX Spark .10.
  base_url: "http://192.168.0.10:8000/v1"
  model: "nvidia/Qwen3.6-35B-A3B-NVFP4"
  temperature: 0
  enable_thinking: false
  timeout_seconds: 180

embeddings:
  # Multilingual FastEmbed запускается внутри процесса на .14; cache лежит в data/models/.
  provider: "fastembed"
  base_url: ""
  model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  dimension: 384
  timeout_seconds: 30
